appId: com.apple.mobilesafari
---
# Token add / invalid / remove. Destructive: ends with no token saved in this browser.
- openLink: http://localhost:8081
- extendedWaitUntil:
    visible: "CashMine"
    timeout: 60000
- runFlow:
    when:
      visible: "Token"
    commands:
      - tapOn: "Token"
      - tapOn: "Remove token"
      - tapOn: "Tap again to remove"
      - openLink: http://localhost:8081
- extendedWaitUntil:
    visible: "Add your API token"
    timeout: 30000
- takeScreenshot: 01-no-token
- tapOn:
    text: "Add token"
    index: 1
- tapOn: "Paste token here"
- inputText: "invalid-token-1234"
- takeScreenshot: 02-token-modal
- tapOn: "Save"
# 401 from the API sends the user back to the token modal.
- extendedWaitUntil:
    visible: "Current token"
    timeout: 60000
- assertVisible: "••••1234"
- takeScreenshot: 03-unauthorized-back-to-token
- tapOn: "Remove token"
- assertVisible: "Tap again to remove"
- tapOn: "Tap again to remove"
- assertVisible: "Paste your API token"
- takeScreenshot: 04-token-removed
